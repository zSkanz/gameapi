# PRODUCTION REFERENCE — not mounted by the dev compose (defaults are fine for dev).
# In production mount this and provide the pg_wal_archive volume (separate from pg_data).

listen_addresses = '*'
max_connections = 100                 # API_REPLICAS x PG_POOL_MAX must stay under this
shared_buffers = 512MB                # ~25% of RAM (tune to the VPS)
effective_cache_size = 1536MB
work_mem = 16MB
maintenance_work_mem = 128MB

# ---- durability / PITR ----
wal_level = replica
archive_mode = on
archive_command = 'test ! -f /wal_archive/%f && cp %p /wal_archive/%f'
max_wal_size = 2GB
min_wal_size = 128MB
checkpoint_completion_target = 0.9

# ---- logging ----
log_min_duration_statement = 500      # log slow queries (ms)
log_checkpoints = on
log_connections = off
