# Correctness-critical Redis config for the stock counters.
# NOTE: Redis does NOT accept inline comments on a directive line
# (e.g. `appendfsync everysec  # ...` fails to parse). Keep comments on their own line.

appendonly yes

# <=1s RPO (use 'always' for a money path if required)
appendfsync everysec

# EXPLICIT ceiling so noeviction fails-closed, not OS-OOM-kill
maxmemory 2gb

# never silently evict a live stock counter
maxmemory-policy noeviction

save 900 1
save 300 100

# AUTH — enable in production. Redis stores every panel session, so an unauthenticated instance
# reachable from any co-located container means session forgery to owner. It is NOT exposed to the
# host or internet here (no `ports:`, backend network only), so this is defence-in-depth against a
# compromised neighbour or an SSRF that reaches port 6379 — but it should be on in prod.
#
# To enable, all three must agree:
#   1. this line, with a strong secret:            requirepass <64-char-random>
#   2. the app's REDIS_URL / REDIS_PASSWORD_FILE:  redis://:<same-secret>@redis:6379/0
#   3. the healthcheck below must authenticate:    redis-cli -a <secret> ping
# Left off by default so a dev `docker compose up` still boots; turning it on without (2) would
# make the API fail to connect, so change all three together.
# requirepass CHANGE_ME
