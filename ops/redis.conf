# Correctness-critical Redis config for the stock counters.
appendonly yes
appendfsync everysec          # <=1s RPO (use 'always' for a money path if required)
maxmemory 2gb                 # EXPLICIT ceiling so noeviction fails-closed, not OS-OOM-kill
maxmemory-policy noeviction   # never silently evict a live stock counter
save 900 1
save 300 100

# Production: uncomment and provide the password via a docker secret + REDIS_PASSWORD_FILE.
# requirepass CHANGE_ME
